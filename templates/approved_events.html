<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approved events · Smart Event Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {% include 'partials/theme.html' %}
</head>
<body class="min-h-screen bg-sand-50 font-sans text-stone-900 antialiased">
  <header class="sticky top-0 z-40 border-b border-amber-200/70 bg-sand-50/80 backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="{{ url_for('home') }}" class="flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-clay-600 text-white shadow-md shadow-orange-900/20">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M3 10h18M8 3v4M16 3v4"></path>
          </svg>
        </span>
        <span class="text-sm font-semibold tracking-tight text-stone-800">Smart Events</span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium text-stone-600">
        <a href="{{ url_for('home') }}" class="transition hover:text-clay-700">Home</a>
        <a href="{{ url_for('organizer_dashboard') }}" class="transition hover:text-clay-700">Organizer</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-10 sm:py-14">
    <p class="text-xs font-semibold uppercase tracking-[0.22em] text-clay-700">Program</p>
    <h1 class="font-display mt-3 text-3xl font-extrabold tracking-tight text-stone-900 sm:text-4xl">Approved events</h1>
    <p class="mt-3 max-w-2xl text-stone-600">
      Officially scheduled sessions with a hall, start time, and end time.
    </p>

    <section class="mt-8 rounded-3xl border border-amber-200 bg-white p-6 shadow-sm sm:p-7">
      <p id="approved-empty" class="rounded-2xl border border-dashed border-amber-200 bg-sand-50 px-4 py-8 text-center text-sm text-stone-500">
        No approved events yet.
      </p>
      <div id="approved-table-wrap" hidden class="hidden overflow-x-auto md:block">
        <table class="min-w-full text-left">
          <caption class="sr-only">Approved events</caption>
          <thead>
            <tr class="text-xs font-semibold uppercase tracking-wide text-stone-400">
              <th scope="col" class="px-3 py-2 font-semibold">Event</th>
              <th scope="col" class="px-3 py-2 font-semibold">Speaker</th>
              <th scope="col" class="px-3 py-2 font-semibold">Date</th>
              <th scope="col" class="px-3 py-2 font-semibold">Time</th>
              <th scope="col" class="px-3 py-2 font-semibold">Hall</th>
              <th scope="col" class="px-3 py-2 font-semibold">Open seats</th>
              <th scope="col" class="px-3 py-2 font-semibold">Status</th>
            </tr>
          </thead>
          <tbody id="approved-body" class="divide-y divide-amber-100"></tbody>
        </table>
      </div>
      <div id="approved-cards" hidden class="space-y-3 md:hidden"></div>
    </section>
  </main>

  <script>
    async function readBody(response) {
      const text = await response.text();
      if (!text) return {};
      try { return JSON.parse(text); } catch (_error) { return { error: "Unexpected response from the server." }; }
    }

    function timeRange(event) {
      if (!event.start_time || !event.end_time) return "—";
      return `${event.start_time}–${event.end_time}`;
    }

    function render(events) {
      const empty = document.getElementById("approved-empty");
      const wrap = document.getElementById("approved-table-wrap");
      const body = document.getElementById("approved-body");
      const cards = document.getElementById("approved-cards");
      body.replaceChildren();
      cards.replaceChildren();
      const hasEvents = events.length > 0;
      empty.hidden = hasEvents;
      wrap.hidden = !hasEvents;
      cards.hidden = !hasEvents;
      events.forEach((event) => {
        const row = document.createElement("tr");
        [
          event.title || "",
          event.speaker_name || event.speaker_id || "—",
          event.date || "",
          timeRange(event),
          event.hall_label || "",
          String(event.remaining_seats ?? ""),
          event.display_status || "Approved",
        ].forEach((value) => {
          const cell = document.createElement("td");
          cell.className = "px-3 py-3 text-sm text-stone-700";
          cell.textContent = value;
          row.append(cell);
        });
        body.append(row);

        const card = document.createElement("article");
        card.className = "rounded-2xl border border-amber-200 bg-sand-50 p-4";
        card.innerHTML = "";
        const title = document.createElement("h3");
        title.className = "text-sm font-semibold text-stone-900";
        title.textContent = event.title || "";
        const meta = document.createElement("p");
        meta.className = "mt-1 text-sm text-stone-500";
        meta.textContent = `${event.date || ""} · ${timeRange(event)} · ${event.hall_label || ""}`;
        card.append(title, meta);
        cards.append(card);
      });
    }

    fetch("/api/attendee/approved", { headers: { Accept: "application/json" } })
      .then(async (response) => {
        const data = await readBody(response);
        render(Array.isArray(data) ? data : []);
      })
      .catch(() => render([]));
  </script>
</body>
</html>
