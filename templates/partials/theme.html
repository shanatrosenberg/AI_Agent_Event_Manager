      community: ["photo-1540575467063-1782f3d4d1c0", "photo-1475721027785-f74eccf877e2", "photo-1505373877841-8d25f7d46678"],
    };
    const GROUPS = [
      [["ai", "artificial", "llm", "rag", "machine learning", "agent", "neural"], "ai"],
      [["security", "cyber", "zero-trust"], "technology"],
      [["architecture", "cqrs", "flask", "platform", "observability", "engineering"], "architecture"],
      [["business", "product"], "business"],
      [["workshop", "hands-on", "lightning"], "workshop"],
      [["community", "mixer", "ama", "invitation", "food"], "community"],
      [["technology", "tech", "software"], "technology"],
    ];
    function matchGroup(text) {
      const blob = String(text || "").toLowerCase();
      if (!blob.trim()) return null;
      for (const [keys, group] of GROUPS) {
        if (blob === group || keys.includes(blob) || keys.some((key) => blob.includes(key))) return group;
      }
      return null;
    }
    function coverKeyword() {
      for (let i = 0; i < arguments.length; i += 1) {
        const matched = matchGroup(arguments[i]);
        if (matched) return matched;
      }
      return "technology";
    }
    function eventCoverUrl() {
      const parts = Array.prototype.slice.call(arguments);
      const seed = String(parts.pop() || "");
      const group = coverKeyword.apply(null, parts);
      const photos = COVERS[group] || COVERS.technology;
      const token = seed || parts[0] || group;
      let sum = 0;
      for (let i = 0; i < token.length; i += 1) sum += token.charCodeAt(i);
      const photo = photos[sum % photos.length];
      return `https://images.unsplash.com/${photo}?auto=format&fit=crop&w=1400&q=70&topic=${group}`;
    }
    function attachEventCover(card, topic, seed, extra) {

    }
    function syncCardRibbon(card, remaining) {

      if (open <= 0) {
        if (!ribbon) {
          ribbon = document.createElement("span");
          ribbon.setAttribute("aria-hidden", "true");
          card.append(ribbon);
        }
        ribbon.className = "event-card__ribbon";
        ribbon.textContent = "SOLD OUT";
        return;
      }
      if (open <= 10) {
        if (!ribbon) {
          ribbon = document.createElement("span");
          ribbon.setAttribute("aria-hidden", "true");
          card.append(ribbon);
        }
        ribbon.className = "event-card__ribbon event-card__ribbon--last";
        ribbon.textContent = "LAST SEATS";
        return;
      }
      if (ribbon) ribbon.remove();
    }
    function syncSoldRibbon(card, sold) {
      const remaining = sold ? 0 : Number(card && card.getAttribute("data-remaining"));
      syncCardRibbon(card, sold ? 0 : (Number.isFinite(remaining) ? remaining : 99));
    }
    window.eventCoverUrl = eventCoverUrl;
    window.attachEventCover = attachEventCover;
    window.syncSoldRibbon = syncSoldRibbon;
    window.syncCardRibbon = syncCardRibbon;
  })();

<script>
  (function () {

    }
    function sameDay(a, b) {
      return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function syncDisplay(root) {

<script>
  (function () {
    const SUCCESS_HOLD_MS = 6000;
    const HOLD_MS = 6000;
    const FADE_MS = 400;

    function isBanner(el) {
      if (!(el instanceof HTMLElement)) return false;
      if (el.closest("[role='alertdialog'], [id$='-chat-alert-popup']")) return false;
      return el.matches('[role="status"], [role="alert"], #status, [id$="-status"], [id$="-form-status"]');
    }

    function bannerKind(el, options) {
      return String((options && options.kind) || el.dataset.statusKind || "").toLowerCase();
    }

    function holdMsFor(kind) {
      return kind === "success" ? SUCCESS_HOLD_MS : HOLD_MS;
    }

    function armStatusDismiss(el, options) {
      if (!(el instanceof HTMLElement)) return;
      if (el.closest("[role='alertdialog'], [id$='-chat-alert-popup']")) return;
      if (!String(el.textContent || "").trim()) return;
      const kind = bannerKind(el, options);
      if (kind) el.dataset.statusKind = kind;
      const signature = `${kind}|${String(el.textContent || "").trim()}`;
      const token = String((Number(el.dataset.dismissToken || 0) + 1));
      el.dataset.dismissToken = token;
      el.dataset.dismissSig = signature;
      el.hidden = false;
      el.classList.remove("hidden", "status-leaving");
      el.removeAttribute("aria-hidden");
      window.clearTimeout(Number(el.dataset.dismissHold || 0));
      window.clearTimeout(Number(el.dataset.dismissFade || 0));
      const hold = window.setTimeout(() => {
        if (el.dataset.dismissToken !== token) return;
        el.classList.add("status-leaving");
        const fade = window.setTimeout(() => {
          if (el.dataset.dismissToken !== token) return;
          el.hidden = true;
          el.classList.add("hidden");
          el.classList.remove("status-leaving");
          el.setAttribute("aria-hidden", "true");
        }, FADE_MS);
        el.dataset.dismissFade = String(fade);
      }, holdMsFor(kind));
      el.dataset.dismissHold = String(hold);
    }

    window.armStatusDismiss = armStatusDismiss;
    window.STATUS_DISMISS_MS = HOLD_MS;
    window.SUCCESS_HOLD_MS = SUCCESS_HOLD_MS;

    function maybeArm(el) {
      if (!isBanner(el) || el.hidden || el.classList.contains("hidden")) return;
      if (!String(el.textContent || "").trim()) return;
      const kind = bannerKind(el);
      const signature = `${kind}|${String(el.textContent || "").trim()}`;
      if (el.dataset.dismissSig === signature && el.dataset.dismissHold) return;
      armStatusDismiss(el, { kind });
    }

    document.querySelectorAll('[role="status"], [role="alert"], #status, [id$="-status"], [id$="-form-status"]').forEach(maybeArm);

    const observer = new MutationObserver((records) => {
      const seen = new Set();
      records.forEach((record) => {
        const nodes = [record.target, ...record.addedNodes];
        nodes.forEach((node) => {
          if (!(node instanceof HTMLElement)) return;
          if (isBanner(node)) seen.add(node);
          else {
            const parent = node.closest('[role="status"], [role="alert"], #status, [id$="-status"], [id$="-form-status"]');
            if (parent) seen.add(parent);
          }
        });
      });
      seen.forEach(maybeArm);
    });
    observer.observe(document.documentElement, {
      subtree: true,
      childList: true,
      characterData: true,
      attributes: true,
      attributeFilter: ["hidden", "class", "data-status-kind"],
    });
  })();
</script>
